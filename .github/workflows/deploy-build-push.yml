name: Build and Push to Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ENVIRONMENT: prod
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
  MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
  MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  ANALYZE_QUEUE_NAME: ${{ secrets.ANALYZE_QUEUE_NAME }}
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  MODEL_KEY: ${{ secrets.MODEL_KEY }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_TEMPERATURE: ${{ secrets.LLM_TEMPERATURE }}
  OPENAI_MODEL_ID: ${{ secrets.OPENAI_MODEL_ID }}
  OPENAI_ORGANIZATION: ${{ secrets.OPENAI_ORGANIZATION }}
  OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  build:
    name: Build Docker Images
    runs-on: self-hosted

    outputs:
      image_tag: ${{ steps.set_image_tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Semantic Version
        id: semantic_version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: 'v'
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat/'
          bump_each_commit_patch_pattern: '/fix|bugfix|chore|refactor|style|docs|test|perf/'
          version_format: '${major}.${minor}.${patch}'
          enable_prerelease_mode: false
          bump_each_commit: true

      - name: Set IMAGE_TAG
        id: set_image_tag
        run: |
          VERSION="${{ steps.semantic_version.outputs.version }}"
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          echo "image_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: BuildX setup
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker image
        run: |
          IMAGE="localhost:5000/bill-lm-server:${{ env.IMAGE_TAG }}"
          docker buildx build --load \
            -f docker/Dockerfile \
            --build-arg ENVIRONMENT=${{ env.ENVIRONMENT }} \
            --build-arg DATABASE_URL="${{ env.DATABASE_URL }}" \
            --build-arg MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            --build-arg MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            --build-arg MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            --build-arg REDIS_HOST=${{ env.REDIS_HOST }} \
            --build-arg MINIO_BUCKET_NAME=${{ env.MINIO_BUCKET_NAME }} \
            --build-arg GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} \
            --build-arg FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }} \
            --build-arg FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }} \
            --build-arg CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }} \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }} \
            --build-arg VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }} \
            --build-arg VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }} \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }} \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }} \
            --build-arg ANALYZE_QUEUE_NAME=${{ env.ANALYZE_QUEUE_NAME }} \
            --build-arg LLM_PROVIDER=${{ env.LLM_PROVIDER }} \
            --build-arg MODEL_KEY=${{ env.MODEL_KEY }} \
            --build-arg LLM_BASE_URL=${{ env.LLM_BASE_URL }} \
            --build-arg LLM_TEMPERATURE=${{ env.LLM_TEMPERATURE }} \
            --build-arg OPENAI_MODEL_ID=${{ env.OPENAI_MODEL_ID }} \
            --build-arg OPENAI_ORGANIZATION=${{ env.OPENAI_ORGANIZATION }} \
            --build-arg OPENAI_PROJECT_ID=${{ env.OPENAI_PROJECT_ID }} \
            --build-arg OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -t $IMAGE .

          echo "✅ Server Image loaded: $IMAGE"

      - name: Build Worker Docker image
        run: |
          IMAGE="localhost:5000/bill-lm-worker:${{ env.IMAGE_TAG }}"
          docker buildx build --load \
            -f docker/Dockerfile.worker \
            --build-arg ENVIRONMENT=${{ env.ENVIRONMENT }} \
            --build-arg DATABASE_URL="${{ env.DATABASE_URL }}" \
            --build-arg MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            --build-arg MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            --build-arg MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            --build-arg REDIS_HOST=${{ env.REDIS_HOST }} \
            --build-arg MINIO_BUCKET_NAME=${{ env.MINIO_BUCKET_NAME }} \
            --build-arg GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} \
            --build-arg FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }} \
            --build-arg FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }} \
            --build-arg CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }} \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }} \
            --build-arg VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }} \
            --build-arg VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }} \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }} \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }} \
            --build-arg ANALYZE_QUEUE_NAME=${{ env.ANALYZE_QUEUE_NAME }} \
            --build-arg LLM_PROVIDER=${{ env.LLM_PROVIDER }} \
            --build-arg MODEL_KEY=${{ env.MODEL_KEY }} \
            --build-arg LLM_BASE_URL=${{ env.LLM_BASE_URL }} \
            --build-arg LLM_TEMPERATURE=${{ env.LLM_TEMPERATURE }} \
            --build-arg OPENAI_MODEL_ID=${{ env.OPENAI_MODEL_ID }} \
            --build-arg OPENAI_ORGANIZATION=${{ env.OPENAI_ORGANIZATION }} \
            --build-arg OPENAI_PROJECT_ID=${{ env.OPENAI_PROJECT_ID }} \
            --build-arg OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -t $IMAGE .

          echo "✅ Worker Image loaded: $IMAGE"

  validate-health:
    name: Validate Docker Images Health
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop production containers
        run: |
          echo "🛑 Stopping prod containers..."
          docker stop bill-lm-server 2>/dev/null || true
          docker stop bill-lm-worker 2>/dev/null || true
          sleep 3
          echo "✅ Containers stopped"

      - name: Cleanup validation containers and images
        if: always()
        run: |
          echo "🧹 Cleaning up validation containers..."
          docker stop bill-lm-server-validate bill-lm-worker-validate 2>/dev/null || true
          docker rm bill-lm-server-validate bill-lm-worker-validate 2>/dev/null || true
          sleep 2
          echo "✅ Validation containers removed"

      - name: Create network
        run: |
          docker network create bill-lm-network 2>/dev/null || echo "Network already exists"

      - name: Start and test Server
        timeout-minutes: 5
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          echo "Validating Server image: localhost:5000/bill-lm-server:${IMAGE_TAG}"

          docker run -d \
            --name bill-lm-server-validate \
            --network bill-lm-network \
            -p 3001:3001 \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e ENVIRONMENT=prod \
            -e MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            -e REDIS_HOST=${{ env.REDIS_HOST }} \
            -e MINIO_BUCKET_NAME=${{ env.MINIO_BUCKET_NAME }} \
            -e GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} \
            -e FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }} \
            -e FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }} \
            -e CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }} \
            -e VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }} \
            -e VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }} \
            -e VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }} \
            -e VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }} \
            -e VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }} \
            -e VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            -e VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }} \
            -e ANALYZE_QUEUE_NAME=${{ env.ANALYZE_QUEUE_NAME }} \
            -e LLM_PROVIDER=${{ env.LLM_PROVIDER }} \
            -e MODEL_KEY=${{ env.MODEL_KEY }} \
            -e LLM_BASE_URL=${{ env.LLM_BASE_URL }} \
            -e LLM_TEMPERATURE=${{ env.LLM_TEMPERATURE }} \
            -e OPENAI_MODEL_ID=${{ env.OPENAI_MODEL_ID }} \
            -e OPENAI_ORGANIZATION=${{ env.OPENAI_ORGANIZATION }} \
            -e OPENAI_PROJECT_ID=${{ env.OPENAI_PROJECT_ID }} \
            -e OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -e NODE_ENV=production \
            -e TZ=UTC \
            "localhost:5000/bill-lm-server:${IMAGE_TAG}"

          echo "⏳ Server container started, waiting for health check..."

          for i in {1..30}; do
            if nc -z localhost 3001 2>/dev/null; then
              echo "✅ Server is healthy on port 3000"
              exit 0
            fi
            echo "⏳ Waiting for server... ($i/30)"
            sleep 2
          done

          echo "❌ Server health check failed"
          docker logs bill-lm-server-validate
          exit 1

      - name: Start and test Worker
        timeout-minutes: 5
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          echo "Validating Worker image: localhost:5000/bill-lm-worker:${IMAGE_TAG}"

          docker run -d \
            --name bill-lm-worker-validate \
            --network bill-lm-network \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e ENVIRONMENT=prod \
            -e MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }} \
            -e REDIS_HOST=${{ env.REDIS_HOST }} \
            -e MINIO_BUCKET_NAME=${{ env.MINIO_BUCKET_NAME }} \
            -e GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }} \
            -e FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }} \
            -e FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }} \
            -e CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }} \
            -e VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }} \
            -e VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }} \
            -e VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }} \
            -e VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }} \
            -e VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }} \
            -e VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }} \
            -e VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }} \
            -e ANALYZE_QUEUE_NAME=${{ env.ANALYZE_QUEUE_NAME }} \
            -e LLM_PROVIDER=${{ env.LLM_PROVIDER }} \
            -e MODEL_KEY=${{ env.MODEL_KEY }} \
            -e LLM_BASE_URL=${{ env.LLM_BASE_URL }} \
            -e LLM_TEMPERATURE=${{ env.LLM_TEMPERATURE }} \
            -e OPENAI_MODEL_ID=${{ env.OPENAI_MODEL_ID }} \
            -e OPENAI_ORGANIZATION=${{ env.OPENAI_ORGANIZATION }} \
            -e OPENAI_PROJECT_ID=${{ env.OPENAI_PROJECT_ID }} \
            -e OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -e NODE_ENV=production \
            -e TZ=UTC \
            "localhost:5000/bill-lm-worker:${IMAGE_TAG}"

          echo "⏳ Worker container started, checking logs..."
          sleep 3

          if docker inspect bill-lm-worker-validate --format='{{.State.Running}}' | grep -q "true"; then
            echo "✅ Worker is running"
          else
            echo "❌ Worker failed to start"
            docker logs bill-lm-worker-validate
            exit 1
          fi

      - name: Cleanup validation containers
        if: always()
        run: |
          echo "🧹 Cleaning up validation containers..."
          docker stop bill-lm-server-validate bill-lm-worker-validate 2>/dev/null || true
          docker rm bill-lm-server-validate bill-lm-worker-validate 2>/dev/null || true
          sleep 2
          echo "✅ Validation containers removed"

      - name: Restart production containers
        if: always()
        run: |
          echo "🔄 Restarting production containers..."
          docker start bill-lm-server 2>/dev/null || echo "⚠️ Server container not found"
          docker start bill-lm-worker 2>/dev/null || echo "⚠️ Worker container not found"
          sleep 2
          echo "✅ Production containers restarted"

  push-to-registry:
    name: Push Docker Images to Registry
    needs: [validate-health, build]
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Server Docker image to registry
        run: |
          IMAGE="localhost:5000/bill-lm-server:${{ needs.build.outputs.image_tag }}"
          docker push $IMAGE
          echo "✅ Server image pushed: $IMAGE"

      - name: Push Worker Docker image to registry
        run: |
          IMAGE="localhost:5000/bill-lm-worker:${{ needs.build.outputs.image_tag }}"
          docker push $IMAGE
          echo "✅ Worker image pushed: $IMAGE"

      - name: Create and push version tag
        run: |
          VERSION="${{ needs.build.outputs.image_tag }}"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping tag creation."
            exit 0
          fi

          git config user.name "enmanuelmag"
          git config user.email "enmanuelmag@cardor.dev"
          git tag -a "v${VERSION}" -m "Release version ${VERSION}"
          git remote set-url origin git@github.com:${{ github.repository }}.git
          git push origin "v${VERSION}"

      - name: Log deployment info
        run: |
          echo "🚀 Deployment Info:"
          echo "   Version: ${{ needs.build.outputs.image_tag }}"
          echo "   Server Image: localhost:5000/bill-lm-server:${{ needs.build.outputs.image_tag }}"
          echo "   Worker Image: localhost:5000/bill-lm-worker:${{ needs.build.outputs.image_tag }}"
          echo "   Environment: Production"

      - name: Cleanup old images (keep only last 3)
        if: always()
        run: |
          echo "🧹 Cleaning old images..."

          # Server images
          IMAGES=$(docker images --filter=reference="localhost:5000/bill-lm-server:*" --format "{{.Repository}}:{{.Tag}}" --no-trunc | sort -r)
          COUNT=0
          echo "$IMAGES" | while read -r IMAGE; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 3 ]; then
              echo "🗑️ Deleting old image: $IMAGE"
              docker rmi "$IMAGE" || true
            else
              echo "✅ Keeping image: $IMAGE"
            fi
          done

          # Worker images
          IMAGES=$(docker images --filter=reference="localhost:5000/bill-lm-worker:*" --format "{{.Repository}}:{{.Tag}}" --no-trunc | sort -r)
          COUNT=0
          echo "$IMAGES" | while read -r IMAGE; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 3 ]; then
              echo "🗑️ Deleting old image: $IMAGE"
              docker rmi "$IMAGE" || true
            else
              echo "✅ Keeping image: $IMAGE"
            fi
          done

          echo "✅ Old images cleanup completed"
